name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Logic checks (pure-Java engine tests)
        run: bash dev-checks/run.sh
      - name: Clean build (compile + test + jar)
        run: ./gradlew clean compileJava compileClientJava build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: intro-member-jar
          path: build/libs/*.jar
